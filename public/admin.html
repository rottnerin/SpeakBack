<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpeakBack — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;800&family=Sora:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card" id="login-card">
      <header class="brand">
        <span class="hex-mark"></span>
        <h1>SpeakBack</h1>
      </header>
      <h2>Admin login</h2>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit">Log in</button>
        <div class="error-box hidden" id="login-error"></div>
      </form>
    </div>

    <div class="hidden" id="dashboard">
      <div class="topbar">
        <h1 style="margin:0;">Submissions</h1>
        <button class="secondary" id="logout-btn">Log out</button>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr><th>Name</th><th>Class</th><th>Submitted</th></tr>
          </thead>
          <tbody id="submissions-body"></tbody>
        </table>
      </div>

      <div class="card hidden" id="detail-card">
        <div id="detail-content"></div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
